[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-falsify"
version = "0.2.1"
description = "MLflow plugin: automatic PRML manifest hash tagging for runs. Pre-registered ML evaluation claims."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Cüneyt Öztürk", email = "hello@falsify.dev" },
]
maintainers = [
]
keywords = [
    "mlflow",
    "mlflow-plugin",
    "prml",
    "falsify",
    "reproducibility",
    "pre-registration",
    "eu-ai-act",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mlflow>=2.0",
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://falsify.dev"
Documentation = "https://spec.falsify.dev/v0.1"
Repository = "https://github.com/studio-11-co/falsify"
Registry = "https://registry.falsify.dev"
PyPI = "https://pypi.org/project/mlflow-falsify/"
Zenodo = "https://doi.org/10.5281/zenodo.20177839"
Issues = "https://github.com/studio-11-co/falsify/issues"

[project.entry-points."mlflow.run_context_provider"]
falsify = "mlflow_falsify.run_context:FalsifyRunContextProvider"

[tool.setuptools.packages.find]
include = ["mlflow_falsify*"]
exclude = ["tests*"]
