# Tests on every push and pull request (the canary only checks the latest
# MLflow weekly). Python 3.11 is the floor set by the `falsify` dependency.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test suite
        run: python -m pytest tests/ -q
